<ion-header>
  <ion-navbar>
    <ion-buttons left>
      <button ion-button icon-only (click)="showAction()">
        <ion-icon name="md-list" style="font-size: 42px;"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title text-center>
      <small>
        BusMap <br> Xe buýt thành phố
      </small>
    </ion-title>
    <ion-buttons right>
      <button ion-button icon-only (click)="showAbout()">
        <ion-icon name="md-bus" style="font-size: 42px;"></ion-icon>
      </button>
    </ion-buttons>
  </ion-navbar>
</ion-header>
<ion-content>
  <div id="map">
  </div>
  <div *ngIf="isOnMap">
    <ion-icon center-both color="primary" name="locate" style="font-size: 32px;" (click)="showStationDetail()"></ion-icon>
  </div>
  <ion-fab *ngIf="!isOnMap" right bottom>
    <button ion-fab>
      <ion-icon name="add"></ion-icon>
    </button>
    <ion-fab-list side="top">
      <div class="fab-item">
        <div color="youtube" class="fab-label">
          Tra cứu
        </div>
        <button ion-fab color="primary" (click)="showLookup()">
          <ion-icon name="search"></ion-icon>
        </button>
      </div>
      <div class="fab-item">
        <div color="youtube" class="fab-label">
          Tìm đường
        </div>
        <button ion-fab color="primary" (click)="showDirection()">
          <ion-icon name="md-navigate"></ion-icon>
        </button>
      </div>
    </ion-fab-list>
  </ion-fab>
</ion-content>
<ion-footer *ngIf="isOnMap">
  <ion-toolbar color="primary">
    <ion-grid>
      <ion-row>
        <ion-col>
          <button ion-button full color="primary" (click)="hideFooter()">
            <small><strong>Thoát</strong></small>
          </button>
        </ion-col>
        <button ion-fab center-vertical color="primary">
          <ion-icon name="locate"></ion-icon>
        </button>
        <ion-col>
          <button ion-button full color="primary">
            <small><strong>Vị trí hiện tại</strong></small>
          </button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
