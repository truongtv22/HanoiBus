<ion-header>
  <ion-navbar>
    <ion-title>
      <small>Đi từ [Điểm tọa độ]</small>
      <br>
      <small>Đến [Điểm tọa độ]</small>
    </ion-title>
  </ion-navbar>
</ion-header>
<ion-content>
  <div id="map-elastic">
  </div>
</ion-content>
<ion-pullup [(state)]="pullupState">
  <ion-toolbar color="light">
    <ion-title>
      <div class="route-number">
        <span><small class="route-number-2">03</small></span>
        <span><small class="route-number-2">11</small></span>
        <span><small class="route-number-3">139</small></span>
      </div>
      &nbsp;
      <small style="position: absolute;">
        Đi bộ: 182 mét
        <br>
        Xe buýt: 2,4 km
      </small>
      <div style="display: inline; float: right;">
        <button ion-button small color="dark" clear icon-only (click)="toggleFooter()">
          <ion-icon name="arrow-up" *ngIf="pullupState == 0"></ion-icon>
          <ion-icon name="arrow-down" *ngIf="(pullupState == 1) || (pullupState == 2)"></ion-icon>
        </button>
      </div>
    </ion-title>
  </ion-toolbar>
  <ion-content>
    <ion-tabs-swiper>
      <ion-tab-swiper tabTitle="Chi tiết cách đi">
        <ion-content class="tab-instruction">
          <div class="fix-scroll">
            <ion-list>
              <button ion-item>
                <ion-icon item-left name="md-walk"></ion-icon>
                <h2>Đón tuyến 11</h2>
                <p>Xuất phát từ: [Điểm tọa độ]</p>
                <p>Đón tuyến 11 tại trạm: Bộ Công an</p>
              </button>
              <button ion-item>
                <ion-icon item-left name="md-bus"></ion-icon>
                <h2>Đón tuyến xe 11</h2>
                <p>Bộ Công an -> Đại học Sài Gòn</p>
              </button>
              <button ion-item>
                <ion-icon item-left name="md-walk"></ion-icon>
                <h2>Chuyển từ tuyến 11 sang tuyến 38</h2>
                <p>Xuống xe tại trạm: Đại học Sài Gòn</p>
                <p>Đón tuyến 38 tại trạm: Đại học Sài Gòn</p>
              </button>
              <button ion-item>
                <ion-icon item-left name="md-bus"></ion-icon>
                <h2>Đón tuyến xe 38</h2>
                <p>Đại học Sài Gòn -> Bệnh viện Tù Dũ</p>
              </button>
              <button ion-item>
                <ion-icon item-left name="md-walk"></ion-icon>
                <h2>Đi bộ tới điểm đến</h2>
                <p>Xuống xe tại trạm: Bệnh viện Tù Dũ</p>
                <p>Đi bộ đến: [Điểm tọa độ]</p>
              </button>
            </ion-list>
          </div>
        </ion-content>
      </ion-tab-swiper>
      <ion-tab-swiper tabTitle="Các trạm đi qua">
        <ion-content class="tab-station-list">
          <div class="fix-scroll">
            <ion-list class="timeline dark">
              <div class="timeline-group">
                <button ion-item class="timeline-item timeline-actived">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  [Điểm tọa độ]
                </button>
              </div>
              <div class="timeline-group youtube">
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  53 - Bộ Công an
                </button>
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  53 - Đại học Sài Gòn
                </button>
              </div>
              <div class="timeline-group facebook">
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  152 - Bệnh viện Răng Hàm Mặt
                </button>
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  152 - Trần Đình Xu
                </button>
              </div>
              <div class="timeline-group googleplus">
                <button ion-item class="timeline-item">
                    <ion-avatar item-left></ion-avatar>
                    <div class="timeline-dot"></div>
                    01 - Trần Đình Xu
                </button>
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  01 - Tổng Cty Samco
                </button>
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  01 - Chợ Nanci
                </button>
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  01 - Nguyễn Biểu
                </button>
              </div>
              <div class="timeline-group">
                <button ion-item class="timeline-item">
                  <ion-avatar item-left></ion-avatar>
                  <div class="timeline-dot"></div>
                  [Điểm tọa độ]
                </button>
              </div>
            </ion-list>
          </div>
        </ion-content>
      </ion-tab-swiper>
    </ion-tabs-swiper>
  </ion-content>
</ion-pullup>
