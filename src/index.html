  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">

  <style media="screen">
    body {
      background-color: #3e70c9;
    }

    .loading {
      font-family: 'Roboto', 'Helvetica Neue', sans-serif;
      text-align: center;
      color: #fff;
      font-size: 14px;
    }

    .loading h2 {
      margin-bottom: 0;
    }

    .loading p {
      margin: 0;
    }

    .loading-header {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      margin-top: 16px;
    }

    .loading-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loading-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      display: block;
      width: 100%;
      margin-bottom: 16px;
    }

    .loading-logo {
      width: 81px;
      height: 81px;
      border-radius: 50%;
      background: #fff;
      margin-left: auto;
      margin-right: auto;
    }

    .loading-logo i {
      font-size: 72px;
      color: #3e70c9;
    }

    .loader {
      margin: 27px auto;
      font-size: 6px;
      width: 1em;
      height: 1em;
      border-radius: 50%;
      position: relative;
      text-indent: -9999em;
      -webkit-animation: load 1.1s infinite ease;
      animation: load 1.1s infinite ease;
      -webkit-transform: translateZ(0);
      -ms-transform: translateZ(0);
      transform: translateZ(0);
    }

    @-webkit-keyframes load {
      0%,
      100% {
        box-shadow: 0em -2.6em 0em 0em #ffffff, 1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2), 2.5em 0em 0 0em rgba(255, 255, 255, 0.2), 1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2), 0em 2.5em 0 0em rgba(255, 255, 255, 0.2), -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.2), -2.6em 0em 0 0em rgba(255, 255, 255, 0.5), -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.7);
      }
      12.5% {
        box-shadow: 0em -2.6em 0em 0em rgba(255, 255, 255, 0.7), 1.8em -1.8em 0 0em #ffffff, 2.5em 0em 0 0em rgba(255, 255, 255, 0.2), 1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2), 0em 2.5em 0 0em rgba(255, 255, 255, 0.2), -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.2), -2.6em 0em 0 0em rgba(255, 255, 255, 0.2), -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.5);

      }
      37.5% {
        box-shadow: 0em -2.6em 0em 0em rgba(255, 255, 255, 0.2), 1.8em -1.8em 0 0em rgba(255, 255, 255, 0.5), 2.5em 0em 0 0em rgba(255, 255, 255, 0.7), 1.75em 1.75em 0 0em #ffffff, 0em 2.5em 0 0em rgba(255, 255, 255, 0.2), -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.2), -2.6em 0em 0 0em rgba(255, 255, 255, 0.2), -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2);

      }

      }
      87.5% {
        box-shadow: 0em -2.6em 0em 0em rgba(255, 255, 255, 0.2), 1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2), 2.5em 0em 0 0em rgba(255, 255, 255, 0.2), 1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2), 0em 2.5em 0 0em rgba(255, 255, 255, 0.2), -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.5), -2.6em 0em 0 0em rgba(255, 255, 255, 0.7), -1.8em -1.8em 0 0em #ffffff;
      }
    }

      }
      12.5% {
        box-shadow: 0em -2.6em 0em 0em rgba(255, 255, 255, 0.7), 1.8em -1.8em 0 0em #ffffff, 2.5em 0em 0 0em rgba(255, 255, 255, 0.2), 1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2), 0em 2.5em 0 0em rgba(255, 255, 255, 0.2), -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.2), -2.6em 0em 0 0em rgba(255, 255, 255, 0.2), -1.8em -1.8em 0 0em rgba(255, 255, 255, 0.5);

      }
      87.5% {
        box-shadow: 0em -2.6em 0em 0em rgba(255, 255, 255, 0.2), 1.8em -1.8em 0 0em rgba(255, 255, 255, 0.2), 2.5em 0em 0 0em rgba(255, 255, 255, 0.2), 1.75em 1.75em 0 0em rgba(255, 255, 255, 0.2), 0em 2.5em 0 0em rgba(255, 255, 255, 0.2), -1.8em 1.8em 0 0em rgba(255, 255, 255, 0.5), -2.6em 0em 0 0em rgba(255, 255, 255, 0.7), -1.8em -1.8em 0 0em #ffffff;
      }
    }
  </style>

</head>

<body>

  <!-- Ionic's root component and where the app will load -->
  <ion-app>
    <div class="loading">
      <div class="loading-header">
        <p>Sở GTVT Tp. Hồ Chí Minh</p>
        <small>Trung tâm quản lý và điều hành vận tải hành khách công cộng</small>
      </div>
      <div class="loading-content">
        <div class="loading-logo">
          <i class="ion-md-bus"></i>
        </div>
        <h2>BUSMAP</h2>
        <p>Xe buýt thành phố</p>
      </div>
      <div class="loading-footer">
        <div class="loader"></div>
        Đang khởi động...
      </div>
    </div>
  </ion-app>

  <!-- Load -->
  <script type="text/javascript">
    function loadJS() {
      /* cordova.js required for cordova apps */
      var element = document.createElement("script");
      element.src = "cordova.js";
      document.body.appendChild(element);

      /* The polyfills js is generated during the build process */
      element = document.createElement("script");
      element.src = "build/polyfills.js";
      document.body.appendChild(element);

      /* The bundle js is generated during the build process */
      element = document.createElement("script");
      element.src = "build/main.js";
      document.body.appendChild(element);
    }

    function main() {
      /* this code to enable service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(() => console.log('service worker installed'))
          .catch(err => console.log('Error', err));
      } */

      if (window.addEventListener)
        window.addEventListener("load", loadJS, false);
      else if (window.attachEvent)
        window.attachEvent("onload", loadJS);
      else window.onload = loadFile;
    }

    main();
  </script>

  <!-- Google Maps JS API -->
  <script src="http://maps.googleapis.com/maps/api/js?key=AIzaSyBPkvXpM3bp8cBbZy8z0dUWQEIXFlEskJQ&sensor=false"></script>
</body>
